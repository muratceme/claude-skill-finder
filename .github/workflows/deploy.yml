name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  # Commits made by the data workflow use GITHUB_TOKEN and therefore never fire `push`;
  # chain on its completion instead so a nightly refresh always reaches the site.
  workflow_run:
    workflows: ["Update skills data"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # No `environment:` block on purpose: the auto-created github-pages environment only allows the
    # branch that was the default when Pages was first enabled, which blocked deploys from main.
    # actions/deploy-pages creates the github-pages deployment itself.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true   # turns GitHub Pages on automatically on first run
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
